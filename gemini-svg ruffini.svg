<svg xmlns="http://www.w3.org/2000/svg" class="math-icon" viewBox="0 0 100 100" width="80" height="80">
  <!-- Líneas directrices del algoritmo -->
  <line x1="32" y1="18" x2="32" y2="82" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round" />
  <line x1="14" y1="62" x2="86" y2="62" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round" />
  <!-- Raíz / Divisor -->
  <circle cx="22" cy="44" r="6" fill="#F59E0B" />
  <!-- Coeficientes del dividendo -->
  <circle cx="45" cy="34" r="5" fill="#06B6D4" />
  <circle cx="62" cy="34" r="5" fill="#06B6D4" />
  <circle cx="78" cy="34" r="5" fill="#06B6D4" />
  <!-- Cociente y Resto (destacado) -->
  <circle cx="45" cy="72" r="5" fill="#10B981" />
  <circle cx="62" cy="72" r="5" fill="#10B981" />
  <circle cx="78" cy="72" r="6.5" fill="#EC4899" />
  <!-- Trazo de descenso -->
  <line x1="45" y1="41" x2="45" y2="60" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 2" />
</svg>

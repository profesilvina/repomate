<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Algorítmica: Regla de Ruffini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px 15px;
      margin: 0;
    }
    .container {
      max-width: 750px;
      margin: 0 auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background: #0369a1; }
    .table-container { margin-top: 24px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td, th { padding: 12px; text-align: center; border: 1px solid #334155; }
    .col-a { background: #0369a1; color: #fff; font-weight: bold; }
    .res-box {
      margin-top: 20px;
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calculadora de la Regla de Ruffini</h1>
    <p>Ingresa los coeficientes del polinomio dividendo P(x) y el valor de 'a' del divisor (x - a).</p>

    <div class="form-group">
      <label for="coefs">Coeficientes de P(x) (separados por comas):</label>
      <input type="text" id="coefs" value="2, -6, 2, -4">
    </div>

    <div class="form-group">
      <label for="val-a">Valor de 'a' (para el divisor x - a):</label>
      <input type="number" id="val-a" value="2">
    </div>

    <button id="btn-calc">Calcular División</button>

    <div class="table-container" id="output" style="display: none;">
      <h3>Tabla del Algoritmo:</h3>
      <table id="ruffini-table"></table>

      <div class="res-box" id="res-box"></div>
    </div>
  </div>

  <script>
    document.getElementById('btn-calc').addEventListener('click', () => {
      const coefsStr = document.getElementById('coefs').value;
      const a = parseFloat(document.getElementById('val-a').value);

      const coefs = coefsStr.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
      if (coefs.length < 2 || isNaN(a)) {
        alert('Ingresa coeficientes válidos.');
        return;
      }

      let mults = [0];
      let results = [coefs[0]];

      for (let i = 1; i < coefs.length; i++) {
        let m = results[i - 1] * a;
        mults.push(m);
        results.push(coefs[i] + m);
      }

      const table = document.getElementById('ruffini-table');
      table.innerHTML = `
        <tr>
          <td class="col-a">a = ${a}</td>
          ${coefs.map(c => `<td>${c}</td>`).join('')}
        </tr>
        <tr>
          <td style="color:#94a3b8">Mult.</td>
          <td>-</td>
          ${mults.slice(1).map(m => `<td>${m}</td>`).join('')}
        </tr>
        <tr style="background:#0284c7; color:#fff; font-weight:bold;">
          <td>Resultado</td>
          ${results.map(r => `<td>${r}</td>`).join('')}
        </tr>
      `;

      const qCoefs = results.slice(0, -1);
      const rem = results[results.length - 1];

      document.getElementById('res-box').innerHTML = `
        <strong>Cociente C(x):</strong> Coeficientes [${qCoefs.join(', ')}]<br>
        <strong>Resto R:</strong> ${rem}
      `;

      document.getElementById('output').style.display = 'block';
    });
  </script>
</body>
</html>
